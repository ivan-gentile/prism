
        <!DOCTYPE html>
        <html lang="it">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>PRISM-AD Report</title>
            
        <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.6;
            color: #2c3e50;
            max-width: 210mm;
            margin: 0 auto;
            padding: 20mm;
            background: #ffffff;
        }
        
        /* Header styling */
        h1 {
            color: #1e3a8a;
            border-bottom: 3px solid #3b82f6;
            padding-bottom: 10px;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 30px;
        }
        
        h2 {
            color: #1e40af;
            font-size: 22px;
            font-weight: 600;
            margin-top: 30px;
            margin-bottom: 15px;
            border-left: 4px solid #3b82f6;
            padding-left: 15px;
        }
        
        h3 {
            color: #1e40af;
            font-size: 18px;
            font-weight: 500;
            margin-top: 25px;
            margin-bottom: 12px;
        }
        
        h4 {
            color: #374151;
            font-size: 16px;
            font-weight: 500;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        
        /* Separatori */
        hr {
            border: none;
            height: 2px;
            background: linear-gradient(to right, #3b82f6, #60a5fa, #3b82f6);
            margin: 25px 0;
        }
        
        /* Tabelle */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        th {
            background: #1e40af;
            color: white;
            padding: 12px 15px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
        }
        
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
        }
        
        tr:nth-child(even) {
            background: #f8fafc;
        }
        
        tr:hover {
            background: #f1f5f9;
        }
        
        /* Codice e valori */
        code {
            background: #f1f5f9;
            color: #1e40af;
            padding: 3px 6px;
            border-radius: 4px;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
            font-weight: 600;
            font-size: 14px;
        }
        
        /* Liste */
        ul, ol {
            margin: 15px 0;
            padding-left: 25px;
        }
        
        li {
            margin: 8px 0;
            line-height: 1.5;
        }
        
        /* Emoji e icone per livelli di rischio */
        .risk-low { color: #059669; font-weight: 600; }
        .risk-medium { color: #d97706; font-weight: 600; }
        .risk-high { color: #dc2626; font-weight: 600; }
        
        /* Box informativi */
        .info-box {
            background: #f0f9ff;
            border: 1px solid #0ea5e9;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
        }
        
        .warning-box {
            background: #fefce8;
            border: 1px solid #eab308;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
        }
        
        .danger-box {
            background: #fef2f2;
            border: 1px solid #ef4444;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
        }
        
        /* Footer */
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px solid #e5e7eb;
            font-size: 12px;
            color: #6b7280;
            text-align: center;
        }
        
        /* Print styles */
        @media print {
            body { margin: 0; padding: 15mm; }
            h1 { page-break-after: avoid; }
            h2, h3, h4 { page-break-after: avoid; }
            table { page-break-inside: avoid; }
            .page-break { page-break-before: always; }
        }
        
        /* Responsiveness */
        @media (max-width: 768px) {
            body { padding: 15px; }
            h1 { font-size: 24px; }
            h2 { font-size: 20px; }
            table { font-size: 12px; }
        }
        </style>
        
        </head>
        <body>
            <h1 id="test-report-prism-ad">Test Report PRISM-AD</h1>
<h2 id="paziente-test">Paziente Test</h2>
<p><strong>Rischio:</strong> 25.3% (CI90: 18.1% - 32.5%)</p>
<p>Questo è un test del nuovo formatter.</p>
            
            <div class="footer">
                <p>Report generato da PRISM-AD v2.0 - Sistema di Intelligenza Artificiale per la Valutazione del Rischio Alzheimer</p>
                <p>Generato il 12/09/2025 alle 11:20</p>
            </div>
        </body>
        </html>
